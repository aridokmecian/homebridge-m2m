name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) - no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Trusted publishing requires npm CLI >= 11.5.1, newer than what Node 22 currently bundles.
      - run: npm install -g npm@latest

      - run: npm run build

      # The trusted publisher for this repo is configured to allow "stage publish" only, not a
      # direct publish - this stages the version but does NOT make it live. A maintainer must
      # separately run `npm stage approve homebridge-m2m@<version>` (interactively, with 2FA) to
      # actually publish it; that step can't be automated, by design.
      - run: npm stage publish
